name: Publish

# Run manually, from a tag named like v1.2.3
on:
  workflow_dispatch:
    inputs:
      index:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the run is from a tag named like a version
        run: '[[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: false  # Release artifacts are never built from a cache
      - run: uv build --no-sources  # Builds the sdist, then the wheel from it
      - name: Check the ref name matches __version__
        run: test -f "dist/async_anywhere-${GITHUB_REF_NAME#v}.tar.gz"
      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import async_anywhere"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  # Each environment needs a matching trusted publisher on its index: this workflow file, and its environment name
  publish-testpypi:
    if: inputs.index == 'testpypi'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/async_anywhere
    permissions:
      id-token: write  # Trusted publishing and attestations
    steps:
      - &download-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: false && inputs.index == 'pypi'  # Off until the first real release: delete "false &&" to turn it on
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/async_anywhere
    permissions:
      id-token: write  # Trusted publishing and attestations
    steps:
      - *download-dist
      - uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b  # v1.14.3

  # Runs only once PyPI has the release, so every GitHub release is installable
  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Creates the release
    steps:
      - *download-dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # No checkout for gh to read the repo from
