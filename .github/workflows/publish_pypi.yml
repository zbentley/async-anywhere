name: Publish to PyPI

# Run manually, from a tag named like v1.2.3
on: workflow_dispatch

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      publishing: true
    permissions:
      contents: read
      actions: read  # test.yml's macos-verdict lists this run's jobs

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/async_anywhere
    permissions:
      id-token: write  # Trusted publishing and attestations
    steps:
      - &download-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Creates the release
    steps:
      - *download-dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # No checkout for gh to read the repo from
