name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # publish.yml runs this before building

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest  # Free for public repos: comment out to skip
        python:
          - "3.14"
          - "3.14t"  # Free-threaded: no GIL
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv run --locked pytest
