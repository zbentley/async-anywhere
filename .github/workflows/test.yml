name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # publish_test_pypi.yml and publish_pypi.yml run this, then publish its dist artifact
    inputs:
      publishing:
        description: Also check the run is from a version tag matching the built version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
#          - macos-latest
        python:
          - "3.14"
          - "3.14t"  # Free-threaded: no GIL
        include:
          - os: ubuntu-latest  # Oldest supported Python (requires-python in pyproject.toml): Linux, GIL build only
            python: "3.13.3"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv run --locked pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: false  # Release artifacts are never built from a cache
      - run: uv build --no-sources
      - name: Check the distributions' metadata and README render
        run: uvx twine@7.0.0 check --strict dist/*
      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import async_anywhere"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  test-misc:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Check the run is from a tag named like a version
        if: inputs.publishing
        run: '[[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]'
      - name: Check the tag matches __version__
        if: inputs.publishing
        run: test -f "dist/async_anywhere-${GITHUB_REF_NAME#v}.tar.gz"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      # -W fails on any warning, -n on broken refs
      - run: uv run --locked sphinx-build -n -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docs-html
          path: docs/_build/html/
