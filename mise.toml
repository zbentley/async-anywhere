[settings]
experimental = true
python.uv_venv_auto = "source"

[tools]
python = "3.14"
uv = "latest"

[deps.uv]
auto = true

[tasks]
'check.deptry' = "deptry ."
'check.safety' = "safety check --ignore 67599 --full-report --file=uv.lock"
'check.pyright' = "pyright ."
'check.test' = 'pytest'
'check.test.debug' = 'pytest --asyncio-debug-all'  # Every event loop in asyncio's debug mode, workers' included
'check.test.torture' = 'pytest --torture'  # Each test 50 times over, with more concurrency: see tests/conftest.py
'docs.clean' = "rm -rf docs/_build"
# TODO only if no gitdiff on docs folder
'docs.regenerate_apidoc' = "sphinx-apidoc -o docs/reference --remove-old --tocfile index --no-headings -e -M src/async_anywhere"

[tasks.'docs.build']
depends = ["docs.clean"]
run = "sphinx-build docs docs/_build --color"

[tasks.docs]
depends = ["docs.build"]
run = "open docs/_build/index.html"

# Serves docs on http://127.0.0.1:8000, rebuilding and reloading the page whenever docs, docstrings, or included files change
# -E: incremental builds miss edits to conf.py's handlers, and skip unchanged pages' warnings
# __pycache__: the build's imports write bytecode into src, which would trigger a second rebuild
# --pre-build: Sphinx never deletes output for removed sources; pages 404 for ~1s while each rebuild runs
[tasks.'docs.watch']
depends = ["docs.clean"]
run = "sphinx-autobuild docs docs/_build --color -E --watch src --watch README.md --watch LICENSE --re-ignore __pycache__ --pre-build 'rm -rf docs/_build'"
