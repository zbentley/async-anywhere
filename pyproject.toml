[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=4,<5"]

[project]
authors = [
  {name = "Zac Bentley", email = "zbentley@users.noreply.github.com"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Topic :: Async Concurrency Management",
]
dependencies = [
    "attrs>=26.1.0",
]
description = "async_anywhere"
dynamic = ["version"]
license = {file = "LICENSE"}
name = "async_anywhere"
readme = "README.md"
requires-python = ">=3.14"

[dependency-groups]
dev = [
  "asgiref>=3.12.1",
  "coverage[toml]>=7.16.2",
  "deptry>=0.25.1",
  "furo>=2025.12.19",
  "myst-parser>=5.1.0",
  "packaging>=26.3",
  "pip>=26.2.1",
  "Pygments>=2.21.0",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-clarity>=1.0.1",
  "pytest-cov>=7.1.0",
  "pytest-doctestplus>=1.7.1",
  "pytest-icdiff>=0.9",
  "pytest-repeat>=0.9.4",
  "pytest-rerunfailures>=16.7",
  "pytest-timeout>=2.4.0",
  "ruff>=0.17.1",
  "safety>=3.8.1",
  "sphinx>=9.1.0",
  "typeguard>=4.6.0",
  "xdoctest[colors]>=1.3.2",
]

[project.urls]
Changelog = "https://github.com/zbentley/async-anywhere/releases"
Documentation = "https://async-anywhere.readthedocs.io"
Homepage = "https://github.com/zbentley/async-anywhere"
Issues = "https://github.com/zbentley/async-anywhere/issues"
Repository = "https://github.com/zbentley/async-anywhere"
Source = "https://github.com/zbentley/async-anywhere"

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.deptry]
experimental_namespace_package = true
known_first_party = ["async_anywhere"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-vvx",
  "--strict-markers",
  "--full-trace",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
timeout = 30  # pytest-timeout: dumps every thread's stack and fails the test
timeout_method = "signal"
filterwarnings = [
  "error",
  "ignore:This process .* is multi-threaded:DeprecationWarning",  # From os.fork(), in tests that fork
]
markers = [
  "logs_asyncio_errors: the test expects asyncio to log errors, and checks caplog itself (see tests/conftest.py)",
]

[tool.black]
line-length = 120
target-version = ["py314"]


[tool.ruff]
line-length = 120
format.docstring-code-format = true
format.skip-magic-trailing-comma = false

[tool.ruff.lint]
extend-select = [
  "B",
  "B9",
  "C",
  "D",
  "PL",
  "E",
  "F",
  "N",
  "I",
  "S",
  "W",
  "N",
  "UP",
  "ASYNC",
  "S",
  "B",
  "A",
  "C4",
  "EXE",
  "ISC",
  "RUF",
]
ignore = [
  "E203",
  "E501",
  "ISC001",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D211",
  # "RST201","RST203","RST301",
  # "W503",
  "D213",
  "S101",
  "S606",
  "PLR2004",
  "UP006",  # Compat with older Pythons
  "UP032", # Compat with older Pythons
  "S311",  # Yells about all uses of random
  "C408", # I like dict() literals, bite me
  "PLW2901", # For-loop variable rebinding: I think the potential efficiency cost outweighs the bug risk.
  "E731", # Sometimes assigning a lambda is the clearest way to express something.
  "PLR0913", # Long signatures are fine
]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"
